<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Gabriel Freire  Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14">
        <animate attributeName="stop-color" values="#070b14;#0a1220;#070b14" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#0a101c">
        <animate attributeName="stop-color" values="#0a101c;#101a2e;#0a101c" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <circle cx="980" cy="90" r="120" fill="url(#glow)">
    <animate attributeName="r" values="110;130;110" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.85;0.55" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="280" r="90" fill="#22d3ee" opacity="0.08">
    <animate attributeName="cy" values="280;250;280" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal accent -->
  <rect x="860" y="110" width="260" height="150" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="880" cy="130" r="5" fill="#ef4444"/>
  <circle cx="898" cy="130" r="5" fill="#eab308"/>
  <circle cx="916" cy="130" r="5" fill="#22c55e"/>
  <text x="880" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">$ whoami</text>
  <text x="880" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#22d3ee">gabriel.freire</text>
  <text x="880" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">role: software_engineer</text>
  <text x="880" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#818cf8">focus: backend · ai · systems</text>
  <rect x="880" y="258" width="8" height="16" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="72" y="118" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="6" fill="#64748b">SOFTWARE ENGINEER</text>

  <text x="72" y="188" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="2" fill="#f8fafc" filter="url(#softGlow)">GABRIEL FREIRE</text>

  <rect x="72" y="212" width="180" height="3" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="80;220;180" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="72" y="258" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">Backend " Architecture " AI Engineering</text>
  <text x="72" y="298" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" fill="#64748b">Building scalable systems, APIs and AI-powered automation.</text>
</svg>
