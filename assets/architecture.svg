<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-label="Engineering architecture mindset">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="980" height="720" rx="24" fill="#070b14"/>
  <rect x="1" y="1" width="978" height="718" rx="24" fill="none" stroke="#1e293b"/>

  <text x="48" y="56" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Engineering Mindset</text>
  <text x="48" y="84" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" fill="#64748b">From intelligence to persistence  clear layers, clear ownership</text>

  <!-- LLM -->
  <rect x="365" y="120" width="250" height="64" rx="14" fill="url(#card)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/>
  <text x="490" y="148" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#67e8f9" letter-spacing="2">INTELLIGENCE</text>
  <text x="490" y="170" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">LLM</text>

  <line x1="490" y1="184" x2="490" y2="220" stroke="url(#line)" stroke-width="2">
    <animate attributeName="stroke-dasharray" values="0 80;80 0" dur="2s" repeatCount="indefinite"/>
  </line>
  <polygon points="490,226 484,214 496,214" fill="#22d3ee"/>

  <!-- Agents -->
  <rect x="365" y="230" width="250" height="64" rx="14" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="490" y="258" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#7dd3fc" letter-spacing="2">REASONING</text>
  <text x="490" y="280" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">AI Agents</text>

  <line x1="490" y1="294" x2="490" y2="330" stroke="url(#line)" stroke-width="2"/>
  <polygon points="490,336 484,324 496,324" fill="#38bdf8"/>

  <!-- Orchestration -->
  <rect x="320" y="340" width="340" height="72" rx="14" fill="url(#card)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="490" y="370" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#a5b4fc" letter-spacing="2">ORCHESTRATION</text>
  <text x="490" y="394" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">LangGraph · MCP · Tools</text>

  <!-- fan out -->
  <path d="M490 412 L490 440 L180 440 L180 470" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M490 412 L490 440 L490 470" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M490 412 L490 440 L800 440 L800 470" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Tools / Services -->
  <rect x="70" y="470" width="220" height="70" rx="14" fill="url(#card)" stroke="#475569"/>
  <text x="180" y="500" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">TOOLS</text>
  <text x="180" y="522" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="650" fill="#e2e8f0">GitLab · Jira · APIs</text>

  <rect x="380" y="470" width="220" height="70" rx="14" fill="url(#card)" stroke="#475569"/>
  <text x="490" y="500" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">SERVICES</text>
  <text x="490" y="522" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="650" fill="#e2e8f0">Backend · Microservices</text>

  <rect x="690" y="470" width="220" height="70" rx="14" fill="url(#card)" stroke="#475569"/>
  <text x="800" y="500" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">SYSTEMS</text>
  <text x="800" y="522" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="650" fill="#e2e8f0">Integrations · Gateway</text>

  <path d="M180 540 L180 575 L490 575 L490 600" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M490 540 L490 600" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M800 540 L800 575 L490 575" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Persistence -->
  <rect x="320" y="600" width="340" height="72" rx="14" fill="url(#card)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="490" y="630" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#67e8f9" letter-spacing="2">PERSISTENCE</text>
  <text x="490" y="654" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">PostgreSQL · Redis</text>
</svg>
